<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instrua</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <strong>Instrua</strong>
  <nav>
    <button data-route="dashboard">Início</button>
    <button data-route="patients">Pacientes</button>
    <button data-route="agenda">Agenda</button>
    <button data-route="instructions">Instruções</button>
    <button id="logoutBtn" class="hidden">Sair</button>
  </nav>
</header>

<main>
<section id="loginView" class="view">
  <div class="card login">
    <h1>Entrar</h1>
    <p>Use sua conta Instrua.</p>
    <form id="loginForm">
      <label>E-mail<input id="email" type="email" required></label>
      <label>Senha<input id="password" type="password" required></label>
      <label>API<input id="apiUrl" value="http://127.0.0.1:8080"></label>
      <button type="submit">Entrar</button>
      <small id="loginError" class="error"></small>
    </form>
  </div>
</section>

<section id="contentView" class="hidden">
  <div id="dashboardPage" class="page">
    <h1>Início</h1>
    <p id="welcomeName"></p>
    <div class="grid">
      <button class="card action" data-route="patients"><strong>Pacientes</strong><span id="patientCount">—</span></button>
      <button class="card action" data-route="agenda"><strong>Agenda</strong><span id="appointmentCount">—</span></button>
      <button class="card action" data-route="instructions"><strong>Instruções</strong><span>→</span></button>
    </div>
    <div class="card" id="companyInfo">Carregando...</div>
  </div>

  <div id="patientsPage" class="page hidden">
    <div class="page-head"><h1>Pacientes</h1><input id="patientSearch" placeholder="Pesquisar"></div>
    <div id="patientList"></div>
  </div>

  <div id="agendaPage" class="page hidden">
    <h1>Agenda</h1>
    <div id="agendaList"></div>
  </div>

  <div id="instructionsPage" class="page hidden">
    <h1>Instruções</h1>
    <div class="card">Área de instruções do atendimento.</div>
  </div>
</section>
</main>
<script src="./app.js"></script>
</body>
</html>
