<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#414a35">
  <meta name="description" content="Instrua — orientação, conexão e confiança. Demonstração interativa.">
  <meta http-equiv="refresh" content="0;url=./demo.html">
  <title>instrua · Demonstração interativa</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#34382d;background:#f5f1e8;--moss:#414a35;--paper:#f5f1e8;--surface:#fcfaf4;--border:#ddd7c8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}
    main{width:min(560px,100%);padding:clamp(24px,5vw,42px);background:var(--surface);border:1px solid var(--border);border-radius:20px}
    .brand{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:650;letter-spacing:-.06em}.mark{width:30px;height:30px;border:1.5px solid var(--moss);border-radius:50%;display:grid;place-items:center;color:var(--moss)}
    h1{font-size:1.6rem;line-height:1.2;margin:28px 0 10px}p{line-height:1.6;color:#686858}.button{display:inline-flex;margin-top:12px;background:var(--moss);color:#fffdf8;text-decoration:none;padding:12px 16px;border-radius:9px;font-weight:650}
  </style>
  <script>window.location.replace('./demo.html');</script>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">✓</span><span>instrua</span></div>
    <h1>Orientação, conexão e confiança.</h1>
    <p>Abrindo a demonstração interativa do produto. Se o redirecionamento não acontecer, use o botão abaixo.</p>
    <a class="button" href="./demo.html">Abrir demo do Instrua</a>
  </main>
</body>
</html>
