name: Generate client dependency lockfile
on:
  push:
    branches: [feat/commercial-core-real-api]
    paths: [.github/workflows/client-lockfile-export.yml]
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        working-directory: clients/instrua-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile for reproducible builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/instrua-app/package-lock.json
          git diff --cached --quiet || {
            git commit -m "build(client): track dependency lockfile for Render"
            git push origin HEAD:feat/commercial-core-real-api
          }
