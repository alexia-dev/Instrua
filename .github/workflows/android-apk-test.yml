name: Android APK QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/instrua-app/**"
      - ".github/workflows/android-apk-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_INSTRUA_API_URL: ${{ vars.VITE_INSTRUA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK/NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: clients/instrua-app
        run: npm install
      - name: Generate icons
        working-directory: clients/instrua-app
        run: npx tauri icon src-tauri/icons/instrua.svg --output src-tauri/icons
      - name: Initialize Android
        working-directory: clients/instrua-app
        env:
          CI: "true"
        run: npm run android:init -- --ci
      - name: Build Android arm64 APK
        working-directory: clients/instrua-app
        env:
          CI: "true"
        run: npm run android:build -- --apk --target aarch64 --ci
      - name: Sign test APK with temporary QA certificate
        shell: bash
        run: |
          set -euo pipefail
          OUTPUTS="clients/instrua-app/src-tauri/gen/android/app/build/outputs"
          UNSIGNED=$(find "$OUTPUTS" -type f -name "*unsigned.apk" -print -quit)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No unsigned APK found for QA signing"
            exit 1
          fi
          QA_KEYSTORE="$RUNNER_TEMP/instrua-qa.jks"
          QA_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair -v -noprompt \
            -keystore "$QA_KEYSTORE" \
            -alias instrua-qa \
            -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=Instrua QA, O=Kiyubi Technologies, C=BR" \
            -storepass "$QA_PASSWORD" -keypass "$QA_PASSWORD"
          SIGNED="$OUTPUTS/instrua-qa-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$QA_KEYSTORE" --ks-key-alias instrua-qa \
            --ks-pass "pass:$QA_PASSWORD" --key-pass "pass:$QA_PASSWORD" \
            --out "$SIGNED" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED"
          echo "QA APK signed and verified. This temporary certificate is NOT for production or Play Store."
      - uses: actions/upload-artifact@v4
        with:
          name: instrua-android-qa-signed
          path: clients/instrua-app/src-tauri/gen/android/app/build/outputs/instrua-qa-signed.apk
          if-no-files-found: error
          retention-days: 14
