name: Android APK QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/instrua-app/**"
      - ".github/workflows/android-apk-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_INSTRUA_API_URL: ${{ vars.VITE_INSTRUA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK/NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: clients/instrua-app
        run: npm install
      - name: Generate icons
        working-directory: clients/instrua-app
        run: npx tauri icon src-tauri/icons/instrua.svg --output src-tauri/icons
      - name: Initialize Android
        working-directory: clients/instrua-app
        env:
          CI: "true"
        run: npm run android:init -- --ci
      - name: Build Android arm64 APK
        working-directory: clients/instrua-app
        env:
          CI: "true"
        run: npm run android:build -- --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: instrua-android-qa-apk
          path: clients/instrua-app/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
