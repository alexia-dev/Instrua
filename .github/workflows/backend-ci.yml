name: Backend CI
on:
  pull_request:
    paths:
      - 'backend/instrua-api/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, feat/instrua-backend-foundation]
    paths:
      - 'backend/instrua-api/**'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/instrua-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: instrua
          POSTGRES_USER: instrua
          POSTGRES_PASSWORD: instrua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instrua -d instrua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/instrua
      DATABASE_USERNAME: instrua
      DATABASE_PASSWORD: instrua
      JWT_SECRET: ci-only-not-for-production-change-me-please-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/instrua-api/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
