name: instrua

services:
  postgres:
    image: postgres:17-alpine
    container_name: instrua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: instrua
      POSTGRES_USER: instrua
      POSTGRES_PASSWORD: instrua_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - instrua_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instrua -d instrua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  instrua_postgres_data: