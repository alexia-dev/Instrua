name: instrua-commercial

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: instrua
      POSTGRES_USER: instrua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - instrua_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instrua -d instrua"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ../backend/instrua-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/instrua
      DATABASE_USERNAME: instrua
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_SECONDS: "3600"
      APP_SECURITY_CORS_ALLOWED_ORIGINS: https://${INSTRUA_DOMAIN:?Set INSTRUA_DOMAIN in .env}
    depends_on:
      database:
        condition: service_healthy
    networks: [private]

  web:
    build:
      context: ../clients/instrua-app
      args:
        VITE_INSTRUA_API_URL: https://${INSTRUA_DOMAIN:?Set INSTRUA_DOMAIN in .env}
    restart: unless-stopped
    networks: [private]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    environment:
      INSTRUA_DOMAIN: ${INSTRUA_DOMAIN:?Set INSTRUA_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

networks:
  private:
volumes:
  instrua_data:
  caddy_data:
  caddy_config:
